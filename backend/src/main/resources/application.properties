# =====================================================
# PICT Lab Booking System - Application Configuration
# =====================================================

spring.application.name=lab-booking

# Server
server.port=8080
server.servlet.context-path=/api

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lab_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:pict-lab-booking-super-secret-key-that-is-long-enough-for-hs512-algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Mail ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@pict.edu}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Logging ----
logging.level.com.pict.labbooking=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
